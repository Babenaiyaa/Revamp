# Simple API Coverage Test Configuration
# Note: spring.profiles.active should NOT be set in profile-specific files

# Disable auto-configuration for external dependencies
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration, \
                              org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration, \
                              org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# Server Configuration - Random port for testing
server.port=0

# Disable MongoDB for tests
spring.data.mongodb.uri=
spring.data.mongodb.database=

# Mock external services
timeslot.api.base=http://localhost:8081
customer.api.base=http://localhost:8082

# Test JWT secret
jwt.secret=testSecretKey12345678901234567890

# Disable Stripe for tests
stripe.api.secret=
stripe.webhook.secret=

# Basic logging for tests
logging.level.org.springframework.web=INFO
logging.level.org.apache.http=INFO