# =============================================================================
# BOOKING SERVICE - MICROSERVICE CONFIGURATION GUIDE
# =============================================================================
# This file contains configuration templates and examples for different
# deployment scenarios. Copy appropriate sections to application.yml

# =============================================================================
# SCENARIO 1: SERVICES BEHIND API GATEWAY (Recommended)
# =============================================================================
server:
  port: 8082

spring:
  application:
    name: booking-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/booking_service_db
      # For production with replica set (enables transactions):
      # uri: mongodb://localhost:27017,localhost:27018,localhost:27019/booking_service_db?replicaSet=myReplicaSet

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Configure Feign clients to call through API Gateway
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: FULL
  hystrix:
    enabled: true  # Enable circuit breaker

# Service names should point to your API Gateway
time-slot-service:
  name: api-gateway
user-profile-service:
  name: api-gateway  
modification-catalog-service:
  name: api-gateway

# Hystrix configuration for circuit breaker
hystrix:
  command:
    default:
      execution:
        timeout:
          enabled: true
        isolation:
          thread:
            timeoutInMilliseconds: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,hystrix.stream
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.bookingservice: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.web: INFO

---
# =============================================================================
# SCENARIO 2: DIRECT SERVICE-TO-SERVICE COMMUNICATION (Alternative)
# =============================================================================
spring:
  profiles: direct-communication

# Service names match the actual service names in Eureka
time-slot-service:
  name: time-slot-service
user-profile-service:
  name: user-profile-service  
modification-catalog-service:
  name: modification-catalog-service

---
# =============================================================================
# SCENARIO 3: LOCAL DEVELOPMENT WITH HARDCODED URLS (Fallback)
# =============================================================================
spring:
  profiles: local-development

# Direct URLs for local development (when services aren't in Eureka yet)
services:
  user-profile:
    url: http://localhost:8081
  time-slot:
    url: http://localhost:8083
  modification-catalog:
    url: http://localhost:8084

# Update your Feign clients to use these URLs when this profile is active
# Example: @FeignClient(name = "user-profile", url = "${services.user-profile.url}")

---
# =============================================================================
# PRODUCTION CONFIGURATION EXAMPLE
# =============================================================================
spring:
  profiles: production

server:
  port: ${PORT:8082}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb-cluster:27017/booking_service_db?replicaSet=rs0}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

logging:
  level:
    com.example.bookingservice: INFO
    org.springframework.cloud.openfeign: WARN
    root: WARN