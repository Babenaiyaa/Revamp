# Configuration for local development without Eureka server
spring:
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  application:
    name: booking-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/booking_service_db
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8082

# Disable Eureka for local development
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Enable mock services for independent development
feign:
  client:
    config:
      default:
        loggerLevel: BASIC

logging:
  level:
    com.example.bookingservice: DEBUG
    org.springframework.cloud.openfeign: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springframework.web: INFO

---
# Production profile with Eureka enabled
spring:
  config:
    activate:
      on-profile: production
  application:
    name: booking-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/booking_service_db}

server:
  port: ${PORT:8082}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: FULL

time-slot-service:
  name: api-gateway
user-profile-service:
  name: api-gateway
modification-catalog-service:
  name: api-gateway

logging:
  level:
    com.example.bookingservice: INFO
    org.springframework.cloud.openfeign: WARN
    root: WARN
