# Application Port - Choose a unique port for this service (e.g., 8081, 8082, etc.)
server.port=8081

# Spring Application Name (for Eureka)
spring.application.name=booking-service

# MongoDB Configuration - Replace 'booking_db' with your desired database name
spring.data.mongodb.uri=mongodb+srv://jdinuja14_db_user:Revamp@bookingservice.crzrdef.mongodb.net/booking_db?appName=bookingservice

# Eureka Client Configuration (assuming Eureka Server runs on 8761)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
# For local development
eureka.instance.hostname=localhost
# Can be useful for some setups
eureka.instance.prefer-ip-address=true

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=true

# Feign Client Service Names - Used for inter-service communication
user-profile-service.name=user-profile-service
modification-catalog-service.name=modification-catalog-service
time-slot-service.name=time-slot-service
